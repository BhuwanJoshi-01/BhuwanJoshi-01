name: Refresh activity card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_github.py
        env:
          # Add a PROFILE_TOKEN secret to count private contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
      - run: python scripts/build.py activity activity-mobile
      - run: mkdir -p dist && cp assets/activity.svg assets/activity-mobile.svg dist/
      # Published to its own branch, the same way the snake is, so main only has my commits.
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
