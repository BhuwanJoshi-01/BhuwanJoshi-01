<svg width="820" height="280" viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
  <defs>
    <clipPath id="round">
      <rect x="1" y="1" width="818" height="278" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="820" height="280" fill="#0d1117"/>
    <rect x="0" y="0" width="820" height="36" fill="#21262d"/>
    <circle cx="20" cy="18" r="7" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="7" fill="#ffbd2e"/>
    <circle cx="68" cy="18" r="7" fill="#27c93f"/>
    <text x="410" y="23" text-anchor="middle" fill="#8b949e" font-size="13">bhuwan@github  ~  zsh</text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
      <text x="24" y="78" font-size="15">
        <tspan fill="#39ff14">$</tspan>
        <tspan fill="#c9d1d9"> whoami</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
      <text x="24" y="108" font-size="15" fill="#58a6ff">bhuwan-joshi · full-stack + mobile + computer vision</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>
      <text x="24" y="150" font-size="15">
        <tspan fill="#39ff14">$</tspan>
        <tspan fill="#c9d1d9"> cat status.txt</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.9s" fill="freeze"/>
      <text x="24" y="180" font-size="15" fill="#e3b341">&gt; shipping real products · open to full-time roles</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.8s" fill="freeze"/>
      <text x="24" y="222" font-size="15">
        <tspan fill="#39ff14">$</tspan>
        <tspan fill="#c9d1d9"> _</tspan>
      </text>
      <rect x="52" y="210" width="9" height="18" fill="#39ff14">
        <animate attributeName="opacity" values="0;0;1;1;0" dur="1s" begin="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="818" height="278" rx="12" ry="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
